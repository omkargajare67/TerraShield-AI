<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 600" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1713" stop-opacity="1"/>
      <stop offset="60%" stop-color="#10251D" stop-opacity="1"/>
      <stop offset="100%" stop-color="#1C4937" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="ridge1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f4b39" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#10251D" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="ridge2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d6a50" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#16392b" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="ridge3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34795C" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#10251D" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="foregroundRidge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10251D" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#08140f" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="mistGlow" cx="50%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#A7E6C5" stop-opacity="0.18"/>
      <stop offset="40%" stop-color="#34795C" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#10251D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Base Atmosphere -->
  <rect width="1440" height="600" fill="url(#skyGrad)"/>
  <rect width="1440" height="600" fill="url(#mistGlow)"/>
  
  <!-- Distant Ridge (Subtle Layered Peaks) -->
  <path d="M0,340 Q180,260 360,310 T720,280 T1080,320 T1440,290 L1440,600 L0,600 Z" fill="url(#ridge1)" opacity="0.6"/>
  
  <!-- Mid Ridge 1 -->
  <path d="M0,380 C220,310 440,410 700,340 C960,270 1200,390 1440,350 L1440,600 L0,600 Z" fill="url(#ridge2)" opacity="0.8"/>
  
  <!-- Mid Ridge 2 with Sharp Topographic Peaks -->
  <path d="M0,420 Q160,350 320,410 Q480,340 640,400 Q800,330 960,390 Q1120,320 1280,380 Q1380,350 1440,370 L1440,600 L0,600 Z" fill="url(#ridge3)" opacity="0.85"/>
  
  <!-- Foreground Rolling Hillslope Crest -->
  <path d="M0,490 C320,430 640,510 960,460 C1200,420 1340,480 1440,460 L1440,600 L0,600 Z" fill="url(#foregroundRidge)"/>
  
  <!-- Subtle Contour Grid Lines -->
  <path d="M0,460 Q360,410 720,450 T1440,430" fill="none" stroke="#A7E6C5" stroke-width="0.75" stroke-opacity="0.15" stroke-dasharray="4,6"/>
  <path d="M0,490 Q360,440 720,480 T1440,460" fill="none" stroke="#A7E6C5" stroke-width="0.75" stroke-opacity="0.12" stroke-dasharray="3,5"/>
  <path d="M0,520 Q360,470 720,510 T1440,490" fill="none" stroke="#A7E6C5" stroke-width="0.75" stroke-opacity="0.08"/>
</svg>
