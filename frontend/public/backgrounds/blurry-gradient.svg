<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <filter id="blurFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
  </defs>
  
  <rect width="1200" height="800" fill="#10251D"/>

  <!-- Ambient Glow Blobs -->
  <g filter="url(#blurFilter)">
    <circle cx="250" cy="220" r="220" fill="#1C4937" opacity="0.8"/>
    <circle cx="950" cy="300" r="260" fill="#34795C" opacity="0.65"/>
    <circle cx="600" cy="650" r="280" fill="#1C4937" opacity="0.7"/>
    <circle cx="350" cy="550" r="180" fill="#A7E6C5" opacity="0.22"/>
    <circle cx="850" cy="180" r="160" fill="#A7E6C5" opacity="0.25"/>
  </g>
</svg>
